site_name: research-graph · публикация результатов
site_description: >-
  Отчёт о публикации результатов экспериментов генератором статических сайтов
  MkDocs Material: GitHub Pages, Helios ИТМО, безопасность пайплайна.
site_author: bpa9008-prog

# Базовый адрес задаётся при сборке: у GitHub Pages и Helios он разный, а у
# preview-сборок на Helios ещё и с подкаталогом preview/<ветка>/.
# От site_url зависят canonical, sitemap.xml и абсолютные ссылки темы.
site_url: !ENV [SITE_URL, "https://bpa9008-prog.github.io/research-graph/"]
use_directory_urls: true

repo_url: https://github.com/bpa9008-prog/research-graph
repo_name: bpa9008-prog/research-graph
edit_uri: edit/master/docs/

copyright: >-
  Текст — <a href="https://creativecommons.org/licenses/by/4.0/deed.ru">CC BY 4.0</a>,
  код — <a href="https://github.com/bpa9008-prog/research-graph/blob/master/LICENSE">MIT</a>.

theme:
  name: material
  language: ru
  custom_dir: overrides
  # Шрифты Google не подгружаются: системный стек шрифтов вместо Roboto.
  # Это убирает два внешних запроса к fonts.googleapis.com / fonts.gstatic.com.
  font: false
  icon:
    logo: material/graph-outline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search:
      # Стеммер lunr.ru поставляется вместе с темой: запрос «регрессия»
      # находит «регрессии», но не «регрессионный» (стемминг, не морфология).
      lang: [ru, en]

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Ссылка на раздел
  - pymdownx.blocks.caption
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      # Номера строк — только у листингов кода (linenums="1" у блока),
      # у текстовых схем они мешают.
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# MathJax лежит в репозитории (docs/assets/vendor), а не на CDN:
# формулы рендерятся, даже если cdn.jsdelivr.net недоступен.
extra_javascript:
  - assets/javascripts/mathjax-config.js
  - assets/vendor/mathjax/tex-svg.js

extra_css:
  - assets/stylesheets/extra.css

extra:
  generator: false
  # Метка сборки: попадает в <meta name="rg-build"> и в подвал каждой страницы.
  # По ней healthcheck отличает свежую выкладку от старой версии в кэше.
  build:
    sha: !ENV [BUILD_SHA, "local"]
    ref: !ENV [BUILD_REF, "local"]
    date: !ENV [BUILD_DATE, "local"]
    target: !ENV [BUILD_TARGET, "local"]

# В режиме --strict любое из этих предупреждений валит сборку.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

not_in_nav: |
  /lab1_report.md

nav:
  - Главная: index.md
  - Ход работы: report/setup.md
  - "T4. Доставка и безопасность": report/t4-security.md
  - "P4. Развёртывание на Helios": report/p4-helios.md
  - Отладка: report/debugging.md
  - Вывод: report/conclusion.md
  - Приложения:
      - Тестовая страница с формулами: report/math-check.md
      - Тексты пайплайнов: report/pipelines.md
      - Лицензии: license.md
